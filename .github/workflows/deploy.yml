
name: Deploy Testimony Portfolio

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::686194639366:role/GitHubActionsPortfolioDeployRole
          aws-region: us-east-1

      - name: Send deployment command to EC2
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-04efad800ba7da47d" \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":["set -e","git -c safe.directory=/home/ubuntu/testimony-portfolio -C /home/ubuntu/testimony-portfolio pull origin main","cd /home/ubuntu/testimony-portfolio","docker build -t testimony-portfolio .","docker rm -f testimony-portfolio-container || true","docker run -d --restart unless-stopped -p 80:80 --name testimony-portfolio-container testimony-portfolio"]}' \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          for i in {1..60}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "i-04efad800ba7da47d" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "Portfolio deployed successfully!"
              exit 0
            fi

            if [[ "$STATUS" == "Failed" || "$STATUS" == "TimedOut" || "$STATUS" == "Cancelled" || "$STATUS" == "Undeliverable" || "$STATUS" == "Terminated" ]]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "i-04efad800ba7da47d" \
                --query '{Output:StandardOutputContent,Error:StandardErrorContent}' \
                --output json
              exit 1
            fi

            sleep 5
          done

          echo "Deployment timed out."
          exit 1
